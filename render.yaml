services:
  - type: web
    name: opportubot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Set manually in the Render dashboard (currently a Neon Postgres URL).
      # sync: false keeps the dashboard value on blueprint syncs.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # Secret — set in the Render dashboard, never committed.
      - key: SERPER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://prismatic-kelpie-ece144.netlify.app
      - key: OWNER_EMAIL
        value: ahmadalbasheer.897@gmail.com
